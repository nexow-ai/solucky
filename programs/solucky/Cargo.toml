[package]
name = "solucky"
version = "1.0.0"
description = "S☉Lucky: verifiable lottery games on Solana: daily, hourly and guess the number."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "solucky"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }

[dev-dependencies]
bincode = "1.3.3"
litesvm = "0.18.1"
solana-account = "4.3.0"
solana-hash = "4.6.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-slot-hashes = "3.2.0"
solana-transaction = "4.1.5"
solana-transaction-error = "3.4.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
