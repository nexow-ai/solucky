name: Deploy

# Builds the app for Cloudflare Workers and deploys it to solucky.me, by hand
# from the Actions tab, so production follows a known commit instead of
# whatever a laptop last built. Needs the repository secrets
# CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, Workers KV Storage: Edit) and
# CLOUDFLARE_ACCOUNT_ID. Public settings come from app/wrangler.jsonc; secrets
# (NUXT_VAPID_PRIVATE_KEY, NUXT_PUSH_SECRET) stay in Cloudflare.

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22
  BUN_VERSION: 1.2.21

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test:js

      - name: Build and deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: The site serves the new build
        run: |
          for i in $(seq 1 30); do
            curl -sf https://solucky.me/_nuxt/builds/latest.json && exit 0
            sleep 2
          done
          exit 1
