name: Deploy

# Builds the app for Cloudflare Workers once and deploys it twice, to
# solucky.me (Mainnet) and devnet.solucky.me (Devnet), once CI passes on a
# push to main (or by hand from the Actions tab), so production follows a
# known commit instead of whatever a laptop last built. Needs the repository
# secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Public settings come
# from app/wrangler.jsonc; secrets (NUXT_CRANK_KEYPAIR, NUXT_RPC_UPSTREAM,
# NUXT_VAPID_PRIVATE_KEY, NUXT_PUSH_SECRET) stay in Cloudflare.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22
  BUN_VERSION: 1.2.21

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI passed on; empty (the chosen branch) when run by hand.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test:js

      - name: Build
        run: bun run build:cloudflare

      - name: Deploy to Devnet
        working-directory: app
        run: bun x wrangler deploy --env devnet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Mainnet
        working-directory: app
        run: bun x wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Both sites serve the new build
        run: |
          build=$(jq -r .id app/.output/public/_nuxt/builds/latest.json)
          for site in https://solucky.me https://devnet.solucky.me; do
            for i in $(seq 1 30); do
              [ "$(curl -sf "$site/_nuxt/builds/latest.json" | jq -r .id)" = "$build" ] && continue 2
              sleep 2
            done
            echo "$site does not serve build $build"; exit 1
          done
