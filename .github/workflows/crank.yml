# Backup crank: settles yesterday's round after midnight UTC (close, draw, pay
# the winner, collect the fee). Scheduled Actions often start minutes late, so
# run `bun run crank --watch` as a service for the main crank; see README.
# Every step is permissionless, so the crank keypair only pays network fees.
#
# Turn it on with the repository variable SOLUCKY_CRANK_ENABLED=true, then set:
#   secret   SOLANA_KEYPAIR_JSON  byte array of a funded keypair (not the upgrade authority)
#   variable SOLANA_RPC_URL       RPC endpoint of the cluster the program runs on
name: Crank

on:
  schedule:
    - cron: '2,12,32 0 * * *'
  workflow_dispatch:

concurrency:
  group: crank
  cancel-in-progress: false

jobs:
  settle:
    if: vars.SOLUCKY_CRANK_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - run: bun install --frozen-lockfile --production --ignore-scripts

      - name: Settle finished rounds
        run: bun run crank --timeout 600
        env:
          SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL }}
          SOLANA_KEYPAIR_JSON: ${{ secrets.SOLANA_KEYPAIR_JSON }}
